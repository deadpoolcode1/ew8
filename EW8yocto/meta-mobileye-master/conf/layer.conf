# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
	${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-mobileye"
BBFILE_PATTERN_meta-mobileye = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-mobileye = "11"

LAYERSERIES_COMPAT_meta-mobileye = "sumo"

